# Alih Daya Attendance Admin Web
# Target Next.js admin web: http://127.0.0.1:3101

server {
    listen 80;
    listen [::]:80;
    server_name admin.financialku.online;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.financialku.online;

    client_max_body_size 20m;

    ssl_certificate /etc/letsencrypt/live/admin.financialku.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.financialku.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    proxy_read_timeout 180;
    proxy_connect_timeout 180;
    proxy_send_timeout 180;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3101/_next/static/;
        proxy_http_version 1.1;
        proxy_cache_valid 200 30d;
    }

    location /api/backend/ {
        proxy_pass https://api.financialku.online/api/v1/;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
