services:
  postgres:
    image: postgres:16-alpine
    container_name: alih-daya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alih-daya-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}
      UPLOAD_STORAGE: ${UPLOAD_STORAGE}
      UPLOAD_DIR: ${UPLOAD_DIR}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER}
      APP_URL: ${APP_URL}
      PORT: ${PORT}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - app_network

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: alih-daya-admin-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${ADMIN_WEB_API_BASE_URL:-/api/backend}
      API_UPSTREAM_URL: ${ADMIN_WEB_API_UPSTREAM_URL:-https://api.financialku.online/api/v1}
    depends_on:
      - backend
    ports:
      - "${ADMIN_WEB_PORT:-3101}:3000"
    networks:
      - app_network

  nginx:
    image: nginx:1.27-alpine
    container_name: alih-daya-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  uploads_data:

networks:
  app_network:
    driver: bridge
